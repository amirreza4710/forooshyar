name: Documentation & Sync Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - work

jobs:
  verify-docs-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required documentation paths
        run: |
          set -eu
          test -d docs/00_Project
          test -d docs/01_PRD
          test -d docs/02_Business
          test -d docs/03_Domain
          test -d docs/04_Architecture
          test -d docs/05_UX
          test -d docs/06_UI
          test -d docs/07_Figma
          test -d docs/08_AI
          test -d docs/09_Development
          test -d docs/checkpoints
          test -d docs/ADR
          test -f AGENTS.md
          test -f PROJECT_STATE.md
          test -f PROJECT_STATUS.md
          test -f CHANGELOG.md

  verify-docs-synchronization:
    name: Verify Docs Synchronized With Code Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Docs Sync
        run: |
          echo "Verifying that documentation is updated alongside code changes..."
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Files changed in this PR:"
          echo "$CHANGED_FILES"

          # Check if code has changed
          CODE_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(lib\/|artifacts\/|apps\/|services\/|scripts\/|package\.json|pnpm-workspace\.yaml)' || true)
          
          if [ -n "$CODE_CHANGED" ]; then
            echo "Code modifications detected in:"
            echo "$CODE_CHANGED"
            
            # Check if documentation files were updated in this same PR
            DOCS_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^(docs\/|CHANGELOG\.md|PROJECT_STATUS\.md|PROJECT_STATE\.md|HANDOVER\.md|README\.md)' || true)
            
            if [ -z "$DOCS_CHANGED" ]; then
              echo "::error::Docs-Drift Policy Violation! Code changes were detected, but no documentation was updated."
              echo "Please update at least one of the following: CHANGELOG.md, PROJECT_STATUS.md, PROJECT_STATE.md, HANDOVER.md, or docs/."
              exit 1
            else
              echo "Documentation updates verified in:"
              echo "$DOCS_CHANGED"
            fi
          else
            echo "No code modifications detected (docs-only or non-code PR). Check passed."
          fi
