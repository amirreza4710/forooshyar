name: Gemini Fast Gate Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai pytest

      # اجرای تست‌ها و ذخیره خروجی لاگ
      - name: Run Tests
        id: test_step
        continue-on-error: true
        run: |
          pytest | tee test_output.log

      # تریاژ شکست توسط جیمینای در صورت بروز خطا
      - name: Triage Failure with Gemini (System 1)
        id: gemini_triage
        if: steps.test_step.outcome != 'success'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/gemini_gate.py

      # ساخت خودکار Issue و تفویض تسک به جولز (System 2 Escalation)
      - name: Create Jules Task Issue
        if: steps.test_step.outcome != 'success' && steps.gemini_triage.outputs.escalate_to_jules == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const category = process.env.TRIAGE_CATEGORY || 'unknown';
            const confidence = process.env.TRIAGE_CONFIDENCE || '0.0';
            const summary = process.env.TRIAGE_SUMMARY || 'خطای تست نیازمند بررسی عمیق';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            const issueTitle = `[Jules Task] CI Triage Escalation: ${summary}`;
            const issueBody = `### 🚨 ارجاع خطا از تریاژ سیستم ۱ به ایجنت جولز (System 2)

            - **دسته‌بندی خطا (Category):** \`${category}\`
            - **سطح اطمینان مدل (Confidence):** \`${confidence}\`
            - **خلاصه تریاژ:** ${summary}
            - **لینک اجرای ناموفق اکشن:** [مشاهده لاگ اجرا](${runUrl})

            ---

            #### دستورالعمل برای جولز (@jules):
            1. فایل‌های تست و کد مرتبط با دسته \`${category}\` را بررسی کن.
            2. ریشه خطای لاگ در اجرای فوق را رفع کن.
            3. یک پول ریکوئست (PR) جدید جهت رفع این مشکل باز کن.
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['jules-task', 'agent-escalation', `triage:${category}`]
            });
        env:
          TRIAGE_CATEGORY: ${{ steps.gemini_triage.outputs.category }}
          TRIAGE_CONFIDENCE: ${{ steps.gemini_triage.outputs.confidence }}
          TRIAGE_SUMMARY: ${{ steps.gemini_triage.outputs.summary }}
