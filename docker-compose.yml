services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: farakhorasan
      POSTGRES_PASSWORD: farakhorasan_password
      POSTGRES_DB: farakhorasan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farakhorasan -d farakhorasan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://farakhorasan:farakhorasan_password@db:5432/farakhorasan_db
      - NODE_ENV=production
      - SESSION_SECRET=this_is_a_very_secret_key_12345
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: artifacts/nadraan/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
