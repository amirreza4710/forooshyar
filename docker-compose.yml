services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farakhorasan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farakhorasan_password}
      POSTGRES_DB: ${POSTGRES_DB:-farakhorasan_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-farakhorasan}:${POSTGRES_PASSWORD:-farakhorasan_password}@db:5432/${POSTGRES_DB:-farakhorasan_db}
      - NODE_ENV=${NODE_ENV:-development}
      - SESSION_SECRET=${SESSION_SECRET:-local-development-session-secret-change-me}
      - SEED_TOKEN=${SEED_TOKEN:-sprint0-dev-seed-token}
      - SEED_ADMIN_USERNAME=${SEED_ADMIN_USERNAME:-امیررضا}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-GAPGPTMASKTOKEN01kpfbu9iqibX0X}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: .
      dockerfile: artifacts/nadraan/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
